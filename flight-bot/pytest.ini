[pytest]
# Pytest configuration for flight-bot scraper tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    -ra

# Test paths
testpaths = flight-bot/tests

# Markers for test categorization
markers =
    format_time: Tests for _format_time() function
    stops: Tests for stop calculation
    direct_only: Tests for direct_only filter
    price_sorting: Tests for price sorting
    max_results: Tests for max_results limit
    scrape_price: Tests for scrape_price function
    search_options: Tests for search_options function
    consent: Tests for consent form handling
    fetch_html: Tests for _fetch_html function
    query_building: Tests for query building
