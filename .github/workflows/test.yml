name: Test Suite

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: cd flight-bot && pip install -r requirements.txt
      - run: cd flight-bot && python -m pytest tests/ -v --tb=short
